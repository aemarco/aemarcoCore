name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history, Nerdbank.GitVersioning needs it

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Nuke Publish
        run: ./build.cmd Publish

      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: drop
          path: build/output/drop

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: |
            build/output/trx
            build/output/cob

  publish:
    needs: build
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: push-to-nuget-org
    permissions:
      id-token: write  # OIDC token for the trusted publishing policy on nuget.org
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          name: drop
          path: ./drop

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages to NuGet.org
        shell: pwsh
        run: |
          Get-ChildItem ./drop -Filter *.nupkg | ForEach-Object {
            Write-Host "Pushing $($_.Name)"
            dotnet nuget push $_.FullName `
              --source https://api.nuget.org/v3/index.json `
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }} `
              --skip-duplicate
          }
